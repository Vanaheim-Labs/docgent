# Docgent Semantic Vocabulary Registry
# The closed contract between authors (content) and designers (CSS).
# If an author needs something not in here, ADD A TERM. Never allow raw HTML.
version: 1

blocks:
  - id: callout
    syntax: "::: callout {kind=note|info|warning|risk|success}"
    description: Boxed aside for emphasis, warnings, or notes.
    attrs:
      kind: { type: enum, values: [note, info, warning, risk, success], default: note }
      title: { type: string, required: false }
    breakInside: avoid

  - id: pullquote
    syntax: "::: pullquote"
    description: Large emphasised quotation lifted from body copy.
    attrs:
      attribution: { type: string, required: false }
      size: { type: enum, values: [normal, large], default: normal }
    breakInside: avoid

  - id: keyfigure
    syntax: "::: keyfigure"
    description: Single dominant statistic with label and optional context.
    attrs:
      value: { type: string, required: true }
      label: { type: string, required: true }
      trend: { type: enum, values: [up, down, flat, none], default: none }
    breakInside: avoid

  - id: figure
    syntax: "::: figure"
    description: Image with caption and optional source line.
    attrs:
      src: { type: string, required: true }
      caption: { type: string, required: false }
      source: { type: string, required: false }
      width: { type: enum, values: [column, full, bleed], default: column }
    breakInside: avoid

  - id: datatable
    syntax: "::: datatable"
    description: Wrapper around a pipe table adding column control and zebra rules.
    attrs:
      widths: { type: string, required: false, note: "comma-separated fr/%, e.g. '2fr,1fr,1fr'" }
      align: { type: string, required: false, note: "comma-separated l|c|r" }
      dense: { type: boolean, default: false }
      caption: { type: string, required: false }
    breakInside: avoid-if-short

  - id: summary
    syntax: "::: summary"
    description: Executive summary block, styled distinctly, usually page one.
    breakInside: auto

  - id: recommendation
    syntax: "::: recommendation"
    description: Numbered recommendation with owner and priority.
    attrs:
      ref: { type: string, required: false }
      owner: { type: string, required: false }
      priority: { type: enum, values: [low, medium, high, critical], default: medium }
    breakInside: avoid

  - id: definition
    syntax: "::: definition"
    description: Term/definition pair for glossaries.
    attrs:
      term: { type: string, required: true }
    breakInside: avoid

  - id: columns
    syntax: "::: columns {count=2}"
    description: Multi-column flow region.
    attrs:
      count: { type: integer, default: 2 }
    breakInside: auto

  - id: pagebreak
    syntax: "::: pagebreak"
    description: Explicit page break. Use sparingly — prefer CSS control.
    attrs:
      to: { type: enum, values: [any, left, right], default: any }

  - id: landscape
    syntax: "::: landscape"
    description: Content rendered on landscape-oriented named page.
    breakInside: page

  - id: appendix
    syntax: "::: appendix"
    description: Appendix region — resets numbering, alternate running header.

  - id: signature
    syntax: "::: signature"
    description: Sign-off block with name, role, date.
    attrs:
      name: { type: string, required: true }
      role: { type: string, required: false }
      date: { type: string, required: false }
    breakInside: avoid

  - id: exec-intro
    syntax: "::: exec-intro"
    description: Full-bleed dark band opening a document's executive summary.
    attrs:
      eyebrow: { type: string, required: false }
    breakInside: avoid

  - id: funnel
    syntax: "::: funnel"
    description: Horizontal stage diagram. Each list item is one stage; use
      "Label — sublabel" to add a caption beneath the stage name.
    breakInside: avoid

  - id: milestones
    syntax: "::: milestones"
    description: Two-column grid of labelled boxes. Each level-3 heading starts
      a new box; its list becomes the box contents.
    breakInside: avoid

  - id: allocation
    syntax: "::: allocation"
    description: Proportional bar chart. Each list item is "Label — NN%".
    breakInside: avoid

  - id: kpigrid
    syntax: "::: {.kpigrid cols=4}"
    description: Row of 2-4 metric cards. Children must be kpicard blocks.
    attrs:
      cols: { type: enum, values: [2, 3, 4], default: 4 }
    breakInside: avoid

  - id: kpicard
    syntax: "::: {.kpicard value=... label=...}"
    description: Single metric card inside a kpigrid. Large value, label above,
      optional change line with directional trend and a source pill.
    attrs:
      value: { type: string, required: true }
      label: { type: string, required: true }
      change: { type: string, required: false }
      trend: { type: enum, values: [up, down, flat, warn], default: flat }
      color: { type: enum, values: [sky, rose, amber, red, green, purple, orange], required: false }
      source: { type: enum, values: [db, gsc, ga4], required: false }
    breakInside: avoid

  - id: daygrid
    syntax: "::: daygrid"
    description: Seven-column Mon-Sun week strip. Children must be daycell blocks.
    breakInside: avoid

  - id: daycell
    syntax: "::: {.daycell day=... value=...}"
    description: One day cell inside a daygrid. Use "—" as the value for a
      pending day rather than omitting the cell, so the week stays seven wide.
    attrs:
      day: { type: string, required: true }
      value: { type: string, required: true }
      state: { type: enum, values: [highlight, anomaly, positive, partial, zero], required: false }
    breakInside: avoid

  - id: tensionbox
    syntax: "::: {.tensionbox title=...}"
    description: Inverted dark callout carrying the single most important
      narrative of a section. Reserve it for one use per document — a second
      one halves the weight of the first. Bold text renders in the accent.
    attrs:
      title: { type: string, required: true }
    breakInside: avoid

  - id: spec
    syntax: "::: spec {title=... subtitle=...}"
    description: Screenshot spec block with optional title and subtitle. Images
      inside flow in a 3-column grid.
    attrs:
      title: { type: string, required: false }
      subtitle: { type: string, required: false }
    breakInside: avoid

  - id: comparison-grid
    syntax: "::: comparison-grid"
    description: Side-by-side product/plan comparison. Each H3 starts a column;
      use class .highlight on the H3 to mark the recommended option.
      Use label= and price= attributes on the H3.
    breakInside: avoid

  - id: product-cards
    syntax: "::: product-cards"
    description: 2-column float grid of product cards. Each H3 starts a card;
      use tag= for the category pill, subtitle= for the sub-heading.
      Bullet list items under each H3 become em-dash rows.
    breakInside: avoid

  - id: roadmap
    syntax: "::: roadmap"
    description: 4-column roadmap table. Use H3 elements with class .head
      (column headers), .period (italic time period row), .tranche (teal
      accent header row), or plain H3 (treated as tranche). Bullet list items
      under a tranche row become item rows; cells separated by " | ".
    breakInside: avoid

  - id: toc
    syntax: "::: toc"
    description: Table of contents placeholder — populated at render time.

  - id: note
    syntax: "::: note {author=... resolved=false}"
    description: Human-in-the-loop editorial direction attached to a section.
      Written by a reviewer in Studio's Review mode, read by the next AI pass as
      rewrite direction. Not document content — hidden in print by default.
    attrs:
      author: { type: string, required: false }
      resolved: { type: boolean, default: false }
    breakInside: avoid

  - id: chart
    syntax: "::chart{label=... title=... caption=...}"
    description: Inline SVG chart with label, title, and caption. Body is raw SVG markup.
    attrs:
      label: { type: string, required: false }
      title: { type: string, required: false }
      caption: { type: string, required: false }
    breakInside: avoid

  - id: key-figure
    syntax: "::key-figure"
    description: Single prominent metric with value, label, and optional source. Use for
      one standout statistic per section. Pairs well with surrounding body copy.
    attrs:
      value: { type: string, required: true }
      label: { type: string, required: true }
      source: { type: string, required: false }
    breakInside: avoid

  - id: kpi-row
    syntax: "::kpi-row"
    description: Horizontal strip of 3–6 KPI metrics. Each list item is a metric with
      value and label keys. Renders as evenly-spaced cards in a single row.
    breakInside: avoid

  - id: risk
    syntax: "::risk{severity=low|medium|high|critical}"
    description: Risk callout block with severity badge. Body describes the risk and
      any mitigations. Rendered with colour-coded severity indicator.
    attrs:
      severity: { type: enum, values: [low, medium, high, critical], default: medium }
      title: { type: string, required: false }
    breakInside: avoid

inlines:
  - id: term
    syntax: "[text]{.term}"
    description: Defined term, links to glossary.
  - id: redact
    syntax: "[text]{.redact}"
    description: Redacted content — blacked out in restricted renders.
  - id: footnoteref
    syntax: "^[footnote text]"
    description: Inline footnote (pandoc native).
  - id: accent
    syntax: "[text]{.accent}"
    description: Accent-coloured word inside a heading. Emphasis is positional —
      reserve it for the two or three headings where the accented word carries
      argumentative weight. Applied to every heading it stops reading as emphasis.
  - id: claim
    syntax: "[text]{.claim kind=fact|drafting|gated}"
    description: Inline chip classifying a claim's evidential status.
    attrs:
      kind: { type: enum, values: [fact, drafting, gated], default: gated }

frontmatter:
  required: [title, brand, doctype, version, date]
  optional:
    - subtitle
    - client
    - author
    - authors
    - classification
    - status
    - reference
    - confidentiality
    - abstract
    - cover_image
    - toc
    - footer_note
    # Deal/offer documents (investment memoranda, term sheets). Kept in the
    # shared registry rather than a brand-local one: a second brand issuing
    # an IM should describe the raise with the same keys.
    - capital_sought
    - instrument
    - target_close
    - contact
  enums:
    classification: [public, internal, confidential, restricted]
    status: [draft, review, approved, released, superseded]
