# DocForge render worker — Fly.io
#
# Build context note: the image needs packages/core (templates, filters, css)
# and brands/. Run \`npm run worker:stage\` from the repo root to populate
# apps/render-worker/pipeline before deploying, or deploy with:
#   fly deploy --dockerfile apps/render-worker/Dockerfile .

app = "docforge-render"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DOCFORGE_PIPELINE_DIR = "/app/pipeline"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 8
    hard_limit = 16

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
