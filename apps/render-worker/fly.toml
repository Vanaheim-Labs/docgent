# fly.toml app configuration file for docgent-render
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'docgent-render'
primary_region = 'syd'

[build]
  dockerfile = 'Dockerfile'

[env]
  DOCGENT_PIPELINE_DIR = '/app/pipeline'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 16
    soft_limit = 8

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
