<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  DocForge font rendering quality.

  FreeType's default hinting is "slight" which produces thin, washed-out
  strokes on Linux — noticeable on Crimson Pro serifs at body sizes.
  "hintfull" instructs the TrueType hinter to maximally align glyph outlines
  to the pixel grid, which produces heavier, crisper strokes much closer to
  what CoreText delivers on macOS.

  rgba=rgb enables subpixel antialiasing on LCD screens and in PDF rasterisers
  that support it (WeasyPrint/Cairo honours this via the FreeType backend).

  lcdfilter=lcddefault applies the standard FIR filter to reduce colour
  fringing on subpixel-rendered glyphs.

  This file is loaded FIRST (prefix 10-) so it establishes the baseline
  before any alias or match rules run.
-->
<fontconfig>

  <!-- Force full hinting on all fonts. "hintfull" maximally aligns glyph
       outlines to pixel boundaries — thicker, crisper strokes, especially
       visible on Crimson Pro's fine serifs at 9–11pt body size. -->
  <match target="font">
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>

  <!-- Crimson Pro specifically: ensure the embedded hinting tables are used
       (the font ships with good TrueType hinting instructions). -->
  <match target="font">
    <test name="family"><string>Crimson Pro</string></test>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
  </match>

  <!-- Inter: variable font — autohinting is slightly better than the embedded
       tables for variable instances. -->
  <match target="font">
    <test name="family"><string>Inter Variable</string></test>
    <edit name="autohint" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
  </match>

</fontconfig>
