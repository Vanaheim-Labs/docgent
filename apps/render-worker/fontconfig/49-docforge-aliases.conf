<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  DocForge font aliases.

  Variable font binaries register under a different family name than the
  design-intent name used in brand tokens:

    InterVariable.ttf            -> "Inter Variable"
    SourceSerif4Variable-Roman   -> "Source Serif 4 Variable"

  brand.yaml should describe design intent, not packaging detail, so the
  mapping lives here rather than leaking into brand config. Without this,
  fontconfig silently falls back to DejaVu/Liberation and the PDF looks
  subtly wrong while every build still reports success.
-->
<fontconfig>

  <!-- Inter: accept the plain name, resolve to the variable family. -->
  <match target="pattern">
    <test qual="any" name="family"><string>Inter</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Inter Variable</string>
    </edit>
  </match>

  <!-- Source Serif 4: same treatment. -->
  <match target="pattern">
    <test qual="any" name="family"><string>Source Serif 4</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Source Serif 4 Variable</string>
    </edit>
  </match>

  <!-- Lora: variable font registers as "Lora" — no alias needed, but add
       a fallback from the generic serif request chain. -->

  <!-- Manrope: variable font registers as "Manrope" — no alias needed. -->

  <!-- Inconsolata: variable font registers as "Inconsolata" — no alias needed. -->

  <!-- Common aliases people reach for; keep them pointing somewhere sane. -->
  <alias>
    <family>Source Serif Pro</family>
    <accept><family>Source Serif 4 Variable</family></accept>
  </alias>
  <alias>
    <family>Helvetica Neue</family>
    <accept><family>Inter Variable</family></accept>
  </alias>
  <alias>
    <family>-apple-system</family>
    <accept><family>Manrope</family></accept>
  </alias>

  <!-- Generic families resolve to brand faces, not DejaVu. -->
  <alias>
    <family>sans-serif</family>
    <prefer><family>Inter Variable</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>Source Serif 4 Variable</family></prefer>
  </alias>

</fontconfig>
