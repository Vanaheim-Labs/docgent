id: inkl
name: inkl
tagline: News Worth Reading

# Inkl's documents live in its own GitHub org.
repo: inkldev/docforge-documents

typography:
  serif: "Lora, Georgia, serif"
  sans: "Manrope, -apple-system, Helvetica Neue, Arial, sans-serif"
  mono: "Inconsolata, Menlo, monospace"
  body_family: sans
  heading_family: sans
  base_size: 10.5pt
  line_height: 1.6
  scale: 1.2

palette:
  ink: "#1C2028"
  ink_soft: "#333333"
  ink_faint: "#999999"
  rule: "#E0E0E0"
  paper: "#FFFFFF"
  paper_alt: "#F5F7FA"
  # Inkl brand orange — primary accent throughout
  accent: "#FF5E17"
  accent_soft: "#FBEBE2"
  # Semantic tones
  warning: "#FF5E17"
  warning_soft: "#FBEBE2"
  risk: "#CC3333"
  risk_soft: "#FFF5F5"
  success: "#61BE88"
  success_soft: "#ECF8F3"
  # Dark ground (cover, exec band)
  band: "#1C2028"

page:
  size: A4
  margin_top: 20mm
  margin_bottom: 25mm
  margin_inner: 20mm
  margin_outer: 20mm

numbering:
  sections: true

cover:
  style: full-bleed-dark
  show_client: false
  show_classification: true

footer:
  left: "Inkl Pty Ltd · ABN 62 167 159 819"
  center: "{{page}}"
  right: "Confidential — not for distribution"

header:
  left: "{{section}}"
  right: "Inkl Pty Ltd · Confidential"

classification_labels:
  public: "PUBLIC"
  internal: "INTERNAL"
  confidential: "CONFIDENTIAL"
  restricted: "STRICTLY CONFIDENTIAL"
