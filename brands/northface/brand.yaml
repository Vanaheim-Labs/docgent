id: northface
name: North Face Investments
tagline: Valuation Infrastructure

# North Face is a separate organisation. Its documents live in its own GitHub
# org so access control follows ownership, not convenience.
repo: north-face-investments/docforge-documents

# Studio access: any verified Google account on the company domain.
access:
  domains: [northface.vc]

typography:
  serif: "Cormorant Garamond, Georgia, serif"
  sans: "Inter, Helvetica Neue, Arial, sans-serif"
  mono: "JetBrains Mono, Menlo, monospace"
  body_family: sans
  heading_family: serif
  base_size: 9.5pt
  line_height: 1.65
  scale: 1.2

# Values transcribed from the v8 stylesheet (brands/northface/source/),
# not sampled from a rendered PDF. Sampling gets the system right and the
# numbers subtly wrong.
palette:
  ink: "#1C1C1A"
  ink_soft: "#2E2E2C"
  ink_faint: "#888880"
  rule: "#E0DDD8"
  paper: "#FAF9F7"
  paper_alt: "#F7F5F1"
  accent: "#C4561A"
  accent_soft: "#F7F0E8"
  # Lighter terracotta used for italic emphasis on dark grounds.
  accent_bright: "#D97941"
  # Exec-summary band; deliberately distinct from ink.
  band: "#2B2B29"
  # Repeated surface tints: blockquote/tfoot ground, table rules and label
  # chips, and the funds-bar track.
  surface_quote: "#F2F0EC"
  surface_mute: "#E8E6E2"
  surface_track: "#ECEAE6"
  warning: "#A35B12"
  warning_soft: "#FDF3E6"
  risk: "#9B2C2C"
  risk_soft: "#FDECEC"
  success: "#1F6B45"
  success_soft: "#E9F5EF"

page:
  size: A4
  margin_top: 18mm
  margin_bottom: 25mm
  margin_inner: 20mm
  margin_outer: 20mm

# This brand renders its own section eyebrows; core's h1/h2 numbering would
# double up with them.
numbering:
  sections: false

cover:
  style: full-bleed-dark
  show_client: false
  show_classification: true

footer:
  left: "{{doc.title}}"
  center: "{{page}}"
  right: "deals@northface.vc · northface.vc"

header:
  left: "NORTH FACE INVESTMENTS"
  right: "{{classification_label}}"

# Display wording for classification levels. The frontmatter carries the
# registry enum; the brand decides how it reads on the page.
classification_labels:
  public: "PUBLIC"
  internal: "INTERNAL"
  confidential: "CONFIDENTIAL"
  restricted: "STRICTLY CONFIDENTIAL"
