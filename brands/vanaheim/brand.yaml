id: vanaheim
name: Vanaheim Partners
tagline: Strategy & Advisory

# Where this brand's documents are stored. One pipeline, many document repos:
# a brand owned by a different org keeps its documents in that org, so access
# control follows ownership rather than convenience.
repo: Vanaheim-Labs/docforge-documents

typography:
  serif: "Source Serif 4, Georgia, serif"
  sans: "Inter, Helvetica Neue, Arial, sans-serif"
  mono: "JetBrains Mono, Menlo, monospace"
  body_family: serif
  heading_family: sans
  base_size: 10.5pt
  line_height: 1.55
  scale: 1.2

palette:
  ink: "#12161c"
  ink_soft: "#454e5a"
  ink_faint: "#8a94a1"
  rule: "#dfe4ea"
  paper: "#ffffff"
  paper_alt: "#f6f8fa"
  accent: "#1f4b6e"
  accent_soft: "#e8f0f6"
  warning: "#a35b12"
  warning_soft: "#fdf3e6"
  risk: "#9b2c2c"
  risk_soft: "#fdecec"
  success: "#1f6b45"
  success_soft: "#e9f5ef"

page:
  size: A4
  margin_top: 22mm
  margin_bottom: 20mm
  margin_inner: 24mm
  margin_outer: 20mm

cover:
  style: rule-band
  logo: assets/logo.svg
  show_client: true
  show_classification: true

footer:
  left: "{{brand.name}}"
  center: "{{classification}}"
  right: "Page {{page}} of {{pages}}"
